<polyline points="81.0,360 81.0,440" fill="none" stroke="#59636E" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#head)"/>
<polyline points="259.0,360 259.0,466.0 142,466.0" fill="none" stroke="#59636E" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#head)"/>
<text x="266.0" y="404" fill="#1F2328" font-size="11.5" font-weight="600" text-anchor="start">auto_merge + CI</text>
<rect x="20" y="525" width="14" height="14" rx="3" fill="#DDF4FF" stroke="#54AEFF" stroke-width="1.5"/>
