<polyline points="773.0,360 773.0,440" fill="none" stroke="#59636E" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#head)"/>
<text x="766.0" y="404" fill="#1F2328" font-size="11.5" font-weight="600" text-anchor="end">HOLD</text>
<polyline points="817.0,440 817.0,360" fill="none" stroke="#59636E" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#head)"/>
