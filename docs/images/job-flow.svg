<rect x="244.99999999999997" y="525" width="14" height="14" rx="3" fill="#FFF8C5" stroke="#D4A72C" stroke-width="1.5"/>
<text x="266.0" y="536" fill="#59636E" font-size="12.5" text-anchor="start">You, or the issue's author</text>
</svg>
