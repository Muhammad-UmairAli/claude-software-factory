<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 444" width="900" height="444" role="img" aria-label="How it's built: on your machine, inside the runtime container, your Claude Code session runs the orchestrator. It spawns the agents and runs the scripts. Every agent tool call passes the guard hook: each agent may write only its one file in factory/jobs, and the builder commits only in its job's worktree. The scripts are the only writer of job state and the only path to GitHub, for pushes, PRs and merges. The container holds no host credentials and can reach only GitHub and an allowlist." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<title>How it's built: on your machine, inside the runtime container, your Claude Code session runs the orchestrator. It spawns the agents and runs the scripts. Every agent tool call passes the guard hook: each agent may write only its one file in factory/jobs, and the builder commits only in its job's worktree. The scripts are the only writer of job state and the only path to GitHub, for pushes, PRs and merges. The container holds no host credentials and can reach only GitHub and an allowlist.</title>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#59636E"/></marker></defs>
<rect x="12" y="12" width="622" height="420" rx="12" fill="none" stroke="#D0D7DE" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="28" y="34" fill="#59636E" font-size="12.5" text-anchor="start">Your machine</text>
<rect x="32" y="46" width="582" height="370" rx="12" fill="none" stroke="#0969DA" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="48" y="68" fill="#0969DA" font-size="12.5" font-weight="600" text-anchor="start">Runtime container: no host credentials; egress to GitHub and an allowlist only</text>
<rect x="60" y="86" width="200" height="56" rx="8" fill="#FFF8C5" stroke="#D4A72C" stroke-width="1.5"/>
<text x="160.0" y="111.0" fill="#633C01" font-size="14" font-weight="600" text-anchor="middle">Orchestrator</text>
<text x="160.0" y="128.0" fill="#7D4E00" font-size="12" text-anchor="middle">your Claude Code session</text>
<rect x="420" y="86" width="180" height="56" rx="3" fill="#FBEFFF" stroke="#C297FF" stroke-width="1.5"/>
<text x="510.0" y="111.0" fill="#3E1F79" font-size="14" font-weight="600" text-anchor="middle">Scripts</text>
<text x="510.0" y="128.0" fill="#6639BA" font-size="12" text-anchor="middle">job, gate, route, doctor</text>
<rect x="720" y="86" width="160" height="56" rx="8" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/>
<text x="800.0" y="111.0" fill="#1F2328" font-size="14" font-weight="600" text-anchor="middle">GitHub</text>
<text x="800.0" y="128.0" fill="#59636E" font-size="12" text-anchor="middle">issues, PRs, CI</text>
<rect x="420" y="196" width="180" height="56" rx="8" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/>
<text x="510.0" y="221.0" fill="#1F2328" font-size="14" font-weight="600" text-anchor="middle">factory/jobs</text>
<text x="510.0" y="238.0" fill="#59636E" font-size="12" text-anchor="middle">job state, audit log</text>
<rect x="420" y="272" width="180" height="56" rx="8" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/>
<text x="510.0" y="297.0" fill="#1F2328" font-size="14" font-weight="600" text-anchor="middle">.worktrees/</text>
<text x="510.0" y="314.0" fill="#59636E" font-size="12" text-anchor="middle">one checkout per job</text>
<rect x="60" y="196" width="200" height="196" rx="8" fill="#DDF4FF" stroke="#54AEFF" stroke-width="1.5"/>
<text x="160" y="218" fill="#0A3069" font-size="14" font-weight="600" text-anchor="middle">Agents</text>
<rect x="76" y="228" width="168" height="24" rx="6" fill="#FFFFFF" stroke="#54AEFF" stroke-width="1"/>
<text x="160.0" y="244.5" fill="#1F2328" font-size="12.5" text-anchor="middle">intake</text>
<rect x="76" y="258" width="168" height="24" rx="6" fill="#FFFFFF" stroke="#54AEFF" stroke-width="1"/>
<text x="160.0" y="274.5" fill="#1F2328" font-size="12.5" text-anchor="middle">spec-writer</text>
<rect x="76" y="288" width="168" height="24" rx="6" fill="#FFFFFF" stroke="#54AEFF" stroke-width="1"/>
<text x="160.0" y="304.5" fill="#1F2328" font-size="12.5" text-anchor="middle">builder</text>
<rect x="76" y="318" width="168" height="24" rx="6" fill="#FFFFFF" stroke="#54AEFF" stroke-width="1"/>
<text x="160.0" y="334.5" fill="#1F2328" font-size="12.5" text-anchor="middle">reviewers</text>
<rect x="76" y="348" width="168" height="24" rx="6" fill="#FFFFFF" stroke="#54AEFF" stroke-width="1"/>
<text x="160.0" y="364.5" fill="#1F2328" font-size="12.5" text-anchor="middle">approver</text>
<rect x="300" y="196" width="44" height="196" rx="6" fill="#FFEBE9" stroke="#FF8182" stroke-width="1.5"/>
<text x="327" y="294" fill="#82071E" font-size="12.5" font-weight="600" text-anchor="middle" transform="rotate(-90 327 294)">guard hook: every tool call</text>
<polyline points="260,114 420,114" fill="none" stroke="#59636E" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#head)"/>
<text x="340" y="106" fill="#1F2328" font-size="11.5" font-weight="600" text-anchor="middle">runs</text>
<polyline points="600,114 720,114" fill="none" stroke="#59636E" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#head)"/>
<text x="642" y="106" fill="#1F2328" font-size="11.5" font-weight="600" text-anchor="start">pushes, PRs</text>
<polyline points="160,142 160,196" fill="none" stroke="#59636E" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#head)"/>
<text x="167" y="174" fill="#1F2328" font-size="11.5" font-weight="600" text-anchor="start">spawns</text>
<polyline points="510,142 510,196" fill="none" stroke="#59636E" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#head)"/>
<text x="517" y="174" fill="#1F2328" font-size="11.5" font-weight="600" text-anchor="start">only writer</text>
<polyline points="260,224 300,224" fill="none" stroke="#59636E" stroke-width="1.5" stroke-linejoin="round"/>
<polyline points="344,224 420,224" fill="none" stroke="#59636E" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#head)"/>
<text x="382" y="216" fill="#1F2328" font-size="11.5" font-weight="600" text-anchor="middle">its one file</text>
<polyline points="260,300 300,300" fill="none" stroke="#59636E" stroke-width="1.5" stroke-linejoin="round"/>
<polyline points="344,300 420,300" fill="none" stroke="#59636E" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#head)"/>
<text x="382" y="292" fill="#1F2328" font-size="11.5" font-weight="600" text-anchor="middle">commits</text>
</svg>
