# Keeps the pinned workflow actions and the pinned linter current. Each update
# arrives as a pull request that CI checks and a person reviews.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /factory/runtime
    schedule:
      interval: weekly
    ignore:
      # Dependabot can't tell an LTS Node major from an odd-numbered one that is
      # never supported for long, so major moves are made by hand.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
